# The ingestor logs one ECS JSON object per line (SPRING_PROFILES_ACTIVE=json), including trace.id and span.id.
# Docker's fluentd log driver forwards each line here; Fluent Bit parses it and ships it to Elasticsearch.
[SERVICE]
    Flush        2
    Parsers_File parsers.conf

[INPUT]
    Name   forward
    Listen 0.0.0.0
    Port   24224

[FILTER]
    Name         parser
    Match        *
    Key_Name     log
    Parser       json
    Reserve_Data On

[OUTPUT]
    Name               es
    Match              *
    Host               elasticsearch
    Port               9200
    Logstash_Format    On
    Logstash_Prefix    telemetry-logs
    Suppress_Type_Name On
    Replace_Dots       On
    Retry_Limit        5
