name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Docker is available on GitHub runners, so the MongoDB Testcontainers tests run here too.
      - run: mvn -B verify
      - name: Validate Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary k8s/
      - name: Validate observability compose stack
        run: docker compose -f docker-compose.yml -f docker-compose.observability.yml config --quiet
      - name: Validate Grafana dashboard JSON
        run: python3 -m json.tool observability/grafana/dashboards/telemetry-stream.json > /dev/null
