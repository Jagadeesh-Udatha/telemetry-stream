apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-stream
data:
  KAFKA_BOOTSTRAP: kafka.messaging.svc.cluster.local:9092
  MONGO_URI: mongodb://mongo.data.svc.cluster.local:27017/telemetry
  CONSUMER_THREADS: "2"
  SPRING_PROFILES_ACTIVE: json
  # OpenTelemetry Collector (e.g. the opentelemetry-collector Helm chart) in the observability namespace
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318/v1/traces
  TRACE_SAMPLING: "0.1"
