spring:
  application:
    name: telemetry-stream
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/telemetry}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: telemetry-ingest
      auto-offset-reset: earliest
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
    listener:
      type: batch
      ack-mode: batch
      concurrency: ${CONSUMER_THREADS:3}
      observation-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: telemetry-stream

telemetry:
  raw-topic: telemetry.raw
  alerts-topic: telemetry.alerts
  overspeed-kph: 80
  retention: 30d
  create-indexes: true
  max-retries: 3

---
# JSON logs for log aggregation (ELK / Loki). Enabled in Kubernetes via SPRING_PROFILES_ACTIVE=json.
spring:
  config:
    activate:
      on-profile: json
logging:
  structured:
    format:
      console: ecs
